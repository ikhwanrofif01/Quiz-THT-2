<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Epiglotitis</title><style>
body{margin:0;background:#f3f6fb;color:#20304a;font:16px Arial}header{background:linear-gradient(120deg,#173b70,#3979c8);color:white;padding:24px}main{max-width:980px;margin:22px auto;padding:0 14px;display:grid;grid-template-columns:1fr 230px;gap:16px}.card{background:white;border:1px solid #dce4f0;border-radius:14px;padding:20px}.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #dce4f0;border-radius:10px;background:white;cursor:pointer;color:#20304a}.opt b{background:#edf2fb;padding:6px 9px;border-radius:6px}.sel{border:2px solid #3267d6;background:#f0f5ff}.ok{background:#e6f7ee;border-color:#16835e}.bad{background:#fff0f1;border-color:#c43c4b}.btn{background:#3267d6;color:white;border:0;padding:12px 16px;border-radius:9px;cursor:pointer;font-weight:bold}.alt{background:#e8edf5;color:#20304a}.row{display:flex;justify-content:space-between;margin-top:20px;gap:8px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.num{padding:9px 0;border:1px solid #dce4f0;background:white;border-radius:7px;cursor:pointer}.cur{background:#3267d6;color:white}.done{background:#dce9ff}.good{background:#dff5e9}.wrong{background:#ffe3e5}.feed{display:none;background:#f1f5fb;padding:13px;border-radius:9px;margin-top:12px;line-height:1.5}.show{display:block}.track{height:8px;background:#e7edf6;margin:15px 0 22px;border-radius:8px}.fill{height:8px;background:#3267d6;width:0}.small{font-size:12px;color:#65748b;line-height:1.5}.result{display:none;text-align:center}.score{font-size:32px;color:#3267d6;font-weight:bold}@media(max-width:700px){main{grid-template-columns:1fr}.side{order:-1}.nums{grid-template-columns:repeat(9,1fr)}}</style></head><body>
<header><h1>CBT · Epiglotitis</h1><p>Latihan soal interaktif · Medical Study Companion</p></header><main><section class="card"><div id="quiz"><span id="counter"></span><span id="answered" style="float:right"></span><div class="track"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feed"></div><div class="row"><button class="btn alt" id="prev">← Sebelumnya</button><button class="btn" id="next">Berikutnya →</button></div></div><div id="result" class="result"><div class="score" id="score"></div><h2 id="message"></h2><p id="details"></p><button class="btn" onclick="restart()">Ulangi kuis (acak)</button></div></section><aside class="card side"><h3 id="sidetitle">Navigasi soal</h3><div id="nums" class="nums"></div><p class="small">Biru: dipilih · Hijau: benar · Merah: salah</p><button class="btn" id="finish" style="width:100%">Selesaikan kuis</button><p class="small">Disusun berdasarkan file Resume Materi Epiglottitis. Terapi dan dosis ditampilkan sebagai isi materi untuk pembelajaran, bukan instruksi klinis.</p></aside></main>
<script>const data=[["Epiglotitis adalah peradangan pada…", ["Epiglotis beserta struktur sekitarnya", "Bronkus", "Esofagus distal", "Nasofaring saja", "Trakea saja"], 0, "Mencakup epiglotis, arytenoid, lipatan aryepiglottic, dan vallecula."], ["Pembengkakan epiglotitis berbahaya karena dapat menyebabkan…", ["Perdarahan otak", "Gagal ginjal", "Anemia", "Gangguan penglihatan", "Asfiksia dan gangguan napas"], 4, "Pembengkakan saluran napas atas dapat menyebabkan asfiksia dan gangguan pernapasan."], ["Usia dengan prevalensi terbanyak menurut sumber…", ["10–15 tahun", "20–30 tahun", "2–6 tahun", "40–50 tahun", "Di atas 70 tahun"], 2, "Sumber menyebut anak usia 2–6 tahun."], ["Imunisasi yang dikaitkan dengan jarangnya kejadian epiglotitis adalah…", ["Campak", "Polio", "BCG", "Hib", "Tetanus"], 3, "Materi menyatakan kondisi ini jarang pada pasien yang mendapatkan imunisasi Hib."], ["Bakteri etiologi yang disebut dalam sumber adalah…", ["Treponema pallidum", "Clostridium tetani", "H. pylori", "Hib", "Vibrio cholerae"], 3, "Hib termasuk etiologi bakteri dalam materi."], ["Trauma lokal yang disebutkan adalah…", ["Kurang tidur", "Olahraga", "Dehidrasi", "Paparan matahari", "Terhirup benda asing atau setelah intubasi"], 4, "Keduanya tercantum sebagai trauma lokal."], ["Obstruksi jalan napas dapat muncul setelah ISPA dalam…", ["1–2 hari", "1–2 menit", "7–10 hari", "6–12 jam", "1 bulan"], 3, "Rentang 6–12 jam disebutkan dalam sumber."], ["Kumpulan gejala yang sesuai materi adalah…", ["Nyeri pinggang", "Poliuria saja", "Ruam saja", "Ikterus dan hematuria", "Demam tinggi, drooling, dysphagia, distress"], 4, "Gejala penting meliputi demam tinggi, drooling, dysphagia, dan distress."], ["Posisi pasien yang dapat ditemukan…", ["Miring dengan kaki terangkat", "Tengkurap", "Duduk/berdiri membungkuk ke depan", "Bersandar ke belakang", "Telentang dengan leher ekstensi"], 2, "Pasien dapat duduk atau berdiri dengan sedikit membungkuk ke depan."], ["Suara yang dicantumkan sebagai manifestasi adalah…", ["Gallop", "Suara vesikuler", "Tidak ada perubahan", "Hot potato sound", "Borborygmi"], 3, "Hot potato sound disebut dalam materi."], ["Stridor dapat terjadi pada…", ["Ekspirasi saja", "Inspirasi atau ekspirasi", "Menelan saja", "Inspirasi saja", "Tidur saja"], 1, "Materi menyebut stridor inspirasi atau ekspirasi."], ["Tanda pada pemeriksaan radiologi adalah…", ["Cherry epiglottis", "Drooling", "Leukositosis", "Thumb sign", "Abses"], 3, "Thumb sign dikaitkan dengan radiologi."], ["Temuan hematologi rutin adalah…", ["Trombositopenia", "Eosinopenia", "Polisitemia", "Leukopenia", "Leukositosis"], 4, "Sumber mencantumkan leukositosis."], ["Endoskopi menunjukkan…", ["Edema supraglottis dan epiglotis merah cherry", "Leukositosis", "Thumb sign", "Abses paru", "Mandibula terdorong ke depan"], 0, "Itulah temuan endoskopi yang dicantumkan."], ["CT dan MRI digunakan untuk menilai…", ["Hot potato sound", "Drooling", "Abses epiglotis", "Leukositosis", "Stridor"], 2, "CT & MRI dikaitkan dengan abses epiglotis."], ["Area hypo-attenuating pada CT sugestif terhadap…", ["Udara trakea", "Tulang normal", "Cairan atau pembentukan awal abses", "Tumor esofagus", "Perdarahan telinga"], 2, "Keterangan gambar menyebut kemungkinan cairan atau pembentukan awal abses."], ["Perawatan yang dicantumkan adalah…", ["Isolasi rumah saja", "Tanpa pemantauan", "Rawat inap ke ICU", "Rawat jalan saja", "Fisioterapi saja"], 2, "Sumber menuliskan rawat inap menuju ICU."], ["Tindakan airway yang disebut setelah diagnosis akut…", ["Trakeostomi atau intubasi", "Dialisis", "Spirometri", "Gips", "Operasi sinus"], 0, "Keduanya dicantumkan dalam bagian terapi."], ["Kelembapan dan suhu kamar yang tercantum…", ["100%; 25–30°C", "20–30%; 30–35°C", "0%; 10°C", "50%; 40°C", "90–95%; 16–20°C"], 4, "Sumber mencantumkan kelembapan 90–95% dan suhu 16–20°C."], ["Antibiotik beserta dosis spesifik yang ditulis…", ["Metronidazol 1 mg/kgBB/hari", "Doksisiklin 10 mg/hari", "Amoksisilin 5 mg/kgBB/hari", "Siprofloksasin 2 gram", "Ampisillin 100 mg/kgBB/hari"], 4, "Itu dosis ampisillin yang tercantum dalam sumber."], ["Kortikosteroid yang dicantumkan…", ["Betametason topikal", "Tidak ada", "Prednison topikal", "Deksametason oral 1 mg", "Hydrokortison 100 mg IV"], 4, "Sumber menyebut hydrokortison 100 mg IV."], ["Analgetik yang dicantumkan…", ["Ibuprofen topikal", "Aspirin 10 gram IV", "Tidak ada", "Morfin oral saja", "Acetaminophen IV 3×1 gram"], 4, "Dosis dalam materi: acetaminophen IV 3×1 gram."], ["Dukungan cairan yang disebutkan…", ["Hidrasi adekuat", "Diuretik rutin", "Cairan hanya saat demam", "Pembatasan total", "Hindari semua cairan"], 0, "Sumber menyebut hidrasi adekuat."], ["Urutan pertama pemeriksaan fisik…", ["MRI", "Sekret terkumpul di orofaring", "Hematologi", "Radiologi", "CT scan"], 1, "Langkah pertama yang ditulis adalah melihat sekret daerah orofaring."], ["Pemeriksaan dengan tongue spatel memperlihatkan…", ["Epiglotis merah dan oedem", "Epiglotis pucat", "Perdarahan esofagus", "Perforasi", "Epiglotis normal"], 0, "Materi menyebut epiglotis merah dan oedem."], ["Laringoskop indirek memperlihatkan…", ["Penyempitan esofagus", "Oedem dan kongesti supraglottis", "Abses paru", "Leukositosis", "Thumb sign"], 1, "Temuan tersebut tercantum dalam urutan pemeriksaan fisik."], ["Pemetaan pemeriksaan yang benar adalah…", ["Tidak ada pemeriksaan", "Radiologi-thumb sign; darah-leukositosis; endoskopi-edema/cherry; CT/MRI-abses", "Radiologi-leukositosis; darah-thumb sign", "Semua pemeriksaan sama", "CT/MRI-stridor"], 1, "Masing-masing modalitas memiliki temuan tersendiri seperti disebutkan dalam materi."]];let qs=[],ans={},graded={},i=0,L=["A","B","C","D","E"];function shuffle(a){for(let n=a.length-1;n>0;n--){let j=Math.floor(Math.random()*(n+1));[a[n],a[j]]=[a[j],a[n]]}return a}function setup(){qs=data.map(s=>({q:s[0],opts:s[1].map((t,j)=>({t,ok:j===s[2]})),ex:s[3]}))}function render(){let s=qs[i];counter.textContent=`Soal ${i+1} dari ${qs.length}`;answered.textContent=`Terjawab: ${Object.keys(ans).length}`;fill.style.width=Object.keys(ans).length/qs.length*100+"%";question.textContent=s.q;options.innerHTML="";s.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="opt";if(ans[i]===j)b.classList.add("sel");if(graded[i]){if(o.ok)b.classList.add("ok");else if(ans[i]===j)b.classList.add("bad")}b.innerHTML=`<b>${L[j]}</b><span>${o.t}</span>`;b.onclick=()=>{if(!graded[i]){ans[i]=j;render()}};options.appendChild(b)});if(graded[i]){let k=s.opts.findIndex(o=>o.ok);feedback.className="feed show";feedback.innerHTML=`<b>${ans[i]===k?"Benar!":"Belum tepat."}</b> ${s.ex}<br><b>Jawaban:</b> ${L[k]}. ${s.opts[k].t}`}else feedback.className="feed";prev.disabled=i===0;next.textContent=i===qs.length-1?"Lihat hasil →":"Berikutnya →";nav()}function nav(){nums.innerHTML="";qs.forEach((s,j)=>{let b=document.createElement("button");b.className="num";b.textContent=j+1;if(i===j)b.classList.add("cur");else if(graded[j])b.classList.add(ans[j]===s.opts.findIndex(o=>o.ok)?"good":"wrong");else if(ans[j]!==undefined)b.classList.add("done");b.onclick=()=>{i=j;render()};nums.appendChild(b)})}prev.onclick=()=>{if(i>0){i--;render()}};next.onclick=()=>{if(i===qs.length-1)finishQuiz();else{i++;render()}};function finishQuiz(){let empty=qs.length-Object.keys(ans).length;if(empty&&!confirm(`Masih ada ${empty} soal kosong. Tetap selesaikan?`))return;qs.forEach((s,j)=>graded[j]=true);let n=qs.reduce((a,s,j)=>a+(ans[j]===s.opts.findIndex(o=>o.ok)?1:0),0);quiz.style.display="none";result.style.display="block";score.textContent=`${n}/${qs.length} (${Math.round(n/qs.length*100)}%)`;message.textContent=n/qs.length>=.8?"Bagus!":n/qs.length>=.6?"Cukup baik—tinjau soal yang keliru.":"Tetap semangat, pelajari pembahasannya.";details.textContent=`Benar: ${n} · Salah/kosong: ${qs.length-n}. Pilih nomor soal untuk meninjau pembahasan.`;sidetitle.textContent="Hasil kuis";finish.textContent="Tinjau soal";finish.onclick=review;nav()}function review(){result.style.display="none";quiz.style.display="block";i=0;render()}function restart(){ans={};graded={};i=0;setup();quiz.style.display="block";result.style.display="none";sidetitle.textContent="Navigasi soal";finish.textContent="Selesaikan kuis";finish.onclick=finishQuiz;render()}finish.onclick=finishQuiz;setup();render();</script></body></html>
